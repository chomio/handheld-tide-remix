<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a24">
<title>조수 — 살아 움직이는 바다</title>
<style>
:root{--bg:#071a24;--panel:#102a35;--ink:#eff7f2;--muted:#a7c0c2;--sea:#26d5bd;--glow:#95fff0;--line:#ffffff20;--accent:#f7b969;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 58% 40%,#12333b 0,transparent 52%),var(--bg);min-height:100vh;overflow-x:hidden}button,input{font:inherit}button{color:inherit}.grain{position:fixed;inset:0;pointer-events:none;opacity:.075;z-index:3;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E")}.shell{max-width:1440px;margin:auto;padding:28px clamp(20px,5vw,76px) 32px;position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;letter-spacing:.22em;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:12px}.brand i{height:8px;width:8px;border-radius:50%;background:var(--sea);box-shadow:0 0 14px var(--sea)}.top-right{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.08em}.sound{background:none;border:1px solid var(--line);border-radius:30px;padding:9px 13px;cursor:pointer}.sound:hover,.sound:focus-visible{border-color:var(--sea);outline:none}.hero{display:grid;grid-template-columns:minmax(290px,.82fr) minmax(480px,1.3fr);gap:20px;align-items:center;min-height:min(730px,calc(100vh - 110px));padding-top:10px}.copy{padding:20px 0 32px;max-width:470px}.eyebrow{color:var(--sea);font-size:12px;letter-spacing:.19em;text-transform:uppercase;margin-bottom:22px}.copy h1{font-weight:500;font-size:clamp(46px,6vw,80px);line-height:.99;letter-spacing:-.065em;margin:0 0 24px}.copy h1 span{color:var(--sea)}.lede{font-size:16px;line-height:1.8;color:#b6ccca;max-width:390px;margin:0 0 36px}.phase-block{border-top:1px solid var(--line);padding-top:18px;max-width:360px}.phase-row{display:flex;justify-content:space-between;align-items:baseline}.phase-name{font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.phase-value{font-size:14px}.phase-value b{font-size:27px;font-weight:500;margin-right:5px}.phase-value small{color:var(--muted);font-size:12px}.phase-track{height:2px;background:#ffffff24;margin:18px 0 12px;position:relative}.phase-track i{position:absolute;left:0;top:0;height:100%;width:var(--progress,52%);background:var(--sea);transition:width .5s}.phase-ticks{display:flex;justify-content:space-between;color:#819ca0;font-size:10px;letter-spacing:.08em}.art{position:relative;min-width:0;isolation:isolate}.canvas-wrap{position:relative;aspect-ratio:1.12/1;max-height:680px;border-radius:50%;overflow:hidden;clip-path:ellipse(49% 47% at 50% 50%);cursor:crosshair}.canvas-wrap:after{content:"";position:absolute;inset:5%;border:1px solid #effff020;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 80px #00171b70}canvas{width:100%;height:100%;display:block}.art-label{position:absolute;z-index:2;pointer-events:none}.label-top{top:8%;left:9%;font-size:10px;color:#c2d9d5;letter-spacing:.16em}.label-bottom{bottom:9%;right:10%;text-align:right;color:#c2d9d5;font-size:10px;letter-spacing:.13em;line-height:1.8}.hint{position:absolute;right:3%;top:50%;writing-mode:vertical-rl;color:#8ca9a9;font-size:10px;letter-spacing:.16em}.pulse{display:inline-block;width:5px;height:5px;background:var(--sea);border-radius:50%;margin-right:7px;vertical-align:middle}.controls{position:absolute;z-index:2;left:50%;bottom:1%;transform:translateX(-50%);display:flex;gap:7px;padding:6px;background:#071a24b8;border:1px solid #ffffff1c;backdrop-filter:blur(14px);border-radius:30px}.icon-btn{width:37px;height:37px;border-radius:50%;border:0;background:transparent;color:#b5ceca;display:grid;place-items:center;cursor:pointer;transition:.2s}.icon-btn:hover,.icon-btn.active{background:#ffffff18;color:var(--glow)}.icon-btn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:26px;border-top:1px solid var(--line);padding-top:18px}.setting{display:flex;align-items:center;gap:12px;min-width:0}.setting label{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.setting output{font-variant-numeric:tabular-nums;color:var(--ink);font-size:11px;min-width:30px;text-align:right}.setting input[type=range]{appearance:none;width:100%;height:2px;background:#ffffff30;outline:0;cursor:pointer}.setting input[type=range]::-webkit-slider-thumb{appearance:none;width:11px;height:11px;background:var(--sea);border:0;border-radius:50%;box-shadow:0 0 0 4px #26d5bd1c}.setting input[type=range]::-moz-range-thumb{width:11px;height:11px;background:var(--sea);border:0;border-radius:50%}.color-row{display:flex;gap:7px;margin-left:auto}.swatch{border:1px solid #ffffff4c;width:16px;height:16px;border-radius:50%;padding:0;cursor:pointer}.swatch[aria-pressed=true]{outline:1px solid white;outline-offset:2px}.footer{display:flex;justify-content:space-between;color:#729093;font-size:10px;letter-spacing:.1em;margin-top:24px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);opacity:0;padding:11px 15px;background:#102a35;border:1px solid var(--line);border-radius:22px;font-size:12px;transition:.25s;pointer-events:none;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.shell{padding-top:20px}.hero{grid-template-columns:1fr;gap:0;min-height:auto;padding-top:52px}.copy{max-width:620px;padding:0 0 4px}.copy h1{font-size:clamp(44px,10vw,70px);margin-bottom:16px}.lede{font-size:14px;margin-bottom:20px}.phase-block{display:none}.art{width:min(100%,660px);margin:0 auto}.canvas-wrap{aspect-ratio:1.04/1}.hint{right:0}.settings{margin-top:12px}.footer{margin-top:22px}}@media(max-width:520px){.shell{padding-inline:17px}.top-right{font-size:10px;gap:8px}.sound{padding:8px 10px}.hero{padding-top:34px}.copy h1{font-size:48px}.lede{line-height:1.65}.settings{grid-template-columns:1fr 1fr;gap:17px 12px}.setting label{font-size:9px}.setting:last-child{grid-column:1/-1}.footer{font-size:9px}.canvas-wrap{clip-path:ellipse(49% 48% at 50% 50%)}}
</style></head>
<body><div class="grain"></div><main class="shell"><header class="top"><div class="brand"><i></i> TIDE / STUDY 01</div><div class="top-right"><span>INTERACTIVE SEA</span><button id="sound" class="sound" aria-pressed="false">소리 켜기</button></div></header>
<section class="hero"><div class="copy"><div class="eyebrow">물결의 시간을 만지는 경험</div><h1>바다는<br><span>숨을 쉰다.</span></h1><p class="lede">화면을 움직여 물결을 흔들어 보세요. 파도의 높이와 속도, 조수의 단계가 당신의 손끝에서 달라집니다.</p><div class="phase-block"><div class="phase-row"><span class="phase-name">현재 조수</span><span class="phase-value"><b id="phaseNum">52</b><small>% · <span id="phaseWord">밀물</span></small></span></div><div class="phase-track"><i id="phaseBar"></i></div><div class="phase-ticks"><span>간조</span><span>중간</span><span>만조</span></div></div></div>
<div class="art"><div class="canvas-wrap" id="scene" aria-label="마우스나 손가락으로 흔들 수 있는 인터랙티브 바다"><span class="art-label label-top"><i class="pulse"></i>LIVE TIDE / <span id="clock">--:--</span></span><span class="art-label label-bottom">DRAG TO DISTURB<br><span id="coordinates">36° 05′ N · 129° 22′ E</span></span><canvas id="sea" aria-hidden="true"></canvas></div><span class="hint">움직여 파동을 만들어 보세요</span>
<nav class="controls" aria-label="아트 컨트롤"><button class="icon-btn active" data-mode="drift" title="부드러운 흐름" aria-label="부드러운 흐름"><svg viewBox="0 0 24 24"><path d="M3 8c3-4 6 4 9 0s6 4 9 0M3 16c3-4 6 4 9 0s6 4 9 0"/></svg></button><button class="icon-btn" data-mode="ripple" title="잔물결" aria-label="잔물결"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/></svg></button><button class="icon-btn" data-mode="storm" title="폭풍" aria-label="폭풍"><svg viewBox="0 0 24 24"><path d="m13 2-3 8H5l6 4-2 8 9-12h-6l1-8Z"/></svg></button><button class="icon-btn" id="pause" title="정지" aria-label="정지"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button><button class="icon-btn" id="capture" title="이미지 저장" aria-label="이미지 저장"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></button></nav></div></section>
<section class="settings" aria-label="파도 조절"><div class="setting"><label for="height">파고</label><input id="height" type="range" min="15" max="90" value="52"><output id="heightOut">52%</output></div><div class="setting"><label for="speed">속도</label><input id="speed" type="range" min="10" max="100" value="42"><output id="speedOut">42%</output></div><div class="setting"><label>빛깔</label><div class="color-row"><button class="swatch" style="background:#26d5bd" data-color="#26d5bd" aria-label="청록" aria-pressed="true"></button><button class="swatch" style="background:#5bb8ff" data-color="#5bb8ff" aria-label="푸른색" aria-pressed="false"></button><button class="swatch" style="background:#c991ff" data-color="#c991ff" aria-label="보랏빛" aria-pressed="false"></button><button class="swatch" style="background:#f7b969" data-color="#f7b969" aria-label="황금빛" aria-pressed="false"></button></div></div></section><footer class="footer"><span>AN EXPERIMENT IN TIDE & TOUCH</span><span>MOVE · PAUSE · LISTEN</span></footer></main><div id="toast" class="toast" role="status"></div>
<script>
(()=>{const canvas=document.querySelector('#sea'),ctx=canvas.getContext('2d'),wrap=document.querySelector('#scene');let w=0,h=0,dpr=1,t=0,level=.52,speed=.42,mode='drift',paused=false,pointer=null,impulses=[],hue='#26d5bd',audio=null,osc=null,gain=null;
const colors={drift:['#071a24','#0b3c46','#127c7a'],ripple:['#071a24','#10334e','#197da0'],storm:['#071521','#142842','#495e8c']};function resize(){const r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(wrap);resize();
function waveY(x,base,amp,phase,scale=1){let y=base+Math.sin(x*.012+phase)*amp*.42+Math.sin(x*.023-phase*1.24)*amp*.23+Math.sin(x*.006+phase*.7)*amp*.34;for(const p of impulses){const dx=x-p.x; y+=Math.sin(Math.sqrt(dx*dx+(base-p.y)**2)*.09-p.life*8)*Math.exp(-Math.sqrt(dx*dx+(base-p.y)**2)*.009)*p.strength*scale}return y}
function draw(){if(!paused)t+=.008+speed*.045;ctx.clearRect(0,0,w,h);let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,colors[mode][0]);bg.addColorStop(.45,colors[mode][1]);bg.addColorStop(1,colors[mode][2]);ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
const cx=w*.5,cy=h*.50,rad=Math.min(w,h)*.43;let glow=ctx.createRadialGradient(cx,cy,rad*.04,cx,cy,rad*1.2);glow.addColorStop(0,hue+'22');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
// atmospheric latitude rings
ctx.lineWidth=1;for(let i=0;i<7;i++){let y=h*(.22+i*.095);ctx.strokeStyle=`rgba(178,237,223,${.035+i*.004})`;ctx.beginPath();ctx.ellipse(cx,y,w*.40,h*(.05+i*.021),0,0,Math.PI*2);ctx.stroke()}
const base=h*(.79-level*.39),amp=h*(mode==='storm'?.06:.035)+h*level*.045;for(let layer=0;layer<6;layer++){let offset=layer*14,phase=t*(.65+layer*.12)+(layer*1.7),a=amp*(1-layer*.105);ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+4;x+=4)ctx.lineTo(x,waveY(x,base+offset,a,phase,1));ctx.lineTo(w,h);ctx.closePath();let gr=ctx.createLinearGradient(0,base+offset-a,0,h);let op=.22+layer*.085;gr.addColorStop(0,hue+Math.round(op*255).toString(16).padStart(2,'0'));gr.addColorStop(1,colors[mode][2]);ctx.fillStyle=gr;ctx.fill();ctx.beginPath();for(let x=0;x<=w+4;x+=4){let y=waveY(x,base+offset,a,phase,1);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle=hue+(layer===0?'cc':'58');ctx.lineWidth=layer===0?1.6:1;ctx.stroke()}
// reflected moonlight
let mx=w*(pointer?pointer.x/w:.73),my=h*.3;let sh=ctx.createRadialGradient(mx,my,0,mx,my,h*.48);sh.addColorStop(0,'#eafff225');sh.addColorStop(.35,hue+'18');sh.addColorStop(1,'transparent');ctx.fillStyle=sh;ctx.fillRect(0,0,w,h);
// hovering motes
for(let i=0;i<32;i++){let x=(i*97+t*18*(i%3+1))%w,y=(i*53+Math.sin(t+i)*18)%h*.75;ctx.fillStyle=`rgba(206,255,238,${.10+(i%4)*.03})`;ctx.fillRect(x,y,1.4,1.4)}
impulses=impulses.filter(p=>p.life<1);for(const p of impulses)p.life+=.013+speed*.02;
if(pointer){ctx.beginPath();ctx.arc(pointer.x,pointer.y,8+Math.sin(t*5)*2,0,Math.PI*2);ctx.strokeStyle=hue+'70';ctx.stroke()}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
function addRipple(e){let r=wrap.getBoundingClientRect();let p={x:e.clientX-r.left,y:e.clientY-r.top,life:0,strength:mode==='storm'?20:12};impulses.push(p);pointer={x:p.x,y:p.y};setTimeout(()=>{if(pointer&&Math.abs(pointer.x-p.x)<3)pointer=null},700)}wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);addRipple(e)});wrap.addEventListener('pointermove',e=>{if(e.buttons){const r=wrap.getBoundingClientRect();pointer={x:e.clientX-r.left,y:e.clientY-r.top};if(Math.random()<.4)addRipple(e)}});wrap.addEventListener('pointerleave',()=>{pointer=null});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));toast(mode==='drift'?'잔잔한 흐름':mode==='ripple'?'잔물결':'폭풍의 바다')});document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.classList.toggle('active',paused);e.currentTarget.setAttribute('aria-label',paused?'재생':'정지');e.currentTarget.innerHTML=paused?'<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>';toast(paused?'흐름을 멈췄어요':'흐름을 다시 시작해요')};document.querySelector('#capture').onclick=()=>{let a=document.createElement('a');a.download='tide-study.png';a.href=canvas.toDataURL('image/png');a.click();toast('파도의 순간을 저장했어요')};
const height=document.querySelector('#height'),sp=document.querySelector('#speed');height.oninput=()=>{level=height.value/100;document.querySelector('#heightOut').value=height.value+'%';document.querySelector('#phaseNum').textContent=height.value;document.querySelector('#phaseBar').style.setProperty('--progress',height.value+'%');document.querySelector('#phaseWord').textContent=height.value>66?'만조':height.value<34?'간조':'밀물'};sp.oninput=()=>{speed=sp.value/100;document.querySelector('#speedOut').value=sp.value+'%'};document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{hue=b.dataset.color;document.documentElement.style.setProperty('--sea',hue);document.documentElement.style.setProperty('--glow',hue);document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',x===b))});
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1500)}function tick(){const d=new Date();document.querySelector('#clock').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});requestAnimationFrame(()=>setTimeout(tick,1000))}tick();
// Optional synthesized ambient audio, started only after explicit opt-in.
document.querySelector('#sound').onclick=async e=>{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();osc=audio.createOscillator();gain=audio.createGain();const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=250;osc.type='sawtooth';osc.frequency.value=54;gain.gain.value=0;osc.connect(filter).connect(gain).connect(audio.destination);osc.start()}if(audio.state==='suspended')await audio.resume();let on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'소리 끄기':'소리 켜기';gain.gain.setTargetAtTime(on?.018:0,audio.currentTime,.7);toast(on?'잔잔한 바다 소리를 켰어요':'소리를 껐어요')};
})();
</script></body></html>
